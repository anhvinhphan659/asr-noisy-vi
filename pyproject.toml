[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "asr-noisy-vi"
version = "0.1.0"
description = "Core audio processing for Vietnamese ASR under noise"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0,<3",
    "soundfile>=0.12",
    "soxr>=0.3",
]

[project.optional-dependencies]
# Libraries used by dataprep, evaluation and the notebooks, not by the core.
# Colab and Kaggle preinstall most of them; pip keeps the existing versions when they
# satisfy these bounds.
notebooks = [
    "pandas>=2.2",
    "pyarrow>=14",
    "huggingface_hub>=0.23",
    "rapidfuzz>=3.0",
]
dev = [
    "asr-noisy-vi[notebooks]",
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["core*", "dataprep*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
